{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-dark text-white">
                <b>Evaluate Student #{{ booking.student_id }}</b>
            </div>
            <div class="card-body">
                <p><strong>Examination:</strong> {{ booking.slot.examination.name }} ({{ booking.slot.examination.exam_type }})</p>
                <p><strong>Maximum Marks:</strong> {{ booking.slot.examination.max_marks }}</p>
                <hr>
                
                <form method="POST" action="{{ url_for('evaluate', booking_id=booking.id) }}">
                    <div class="mb-3">
                        <label><b>Marks Obtained</b></label>
                        <input type="number" step="0.5" class="form-control" name="marks_obtained" min="0" max="{{ booking.slot.examination.max_marks }}" required>
                    </div>
                    <div class="mb-4">
                        <label><b>Feedback / Comments</b></label>
                        <textarea class="form-control" name="feedback" rows="3" placeholder="Enter evaluation notes..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit Final Evaluation</button>
                </form>
                
                <div class="mt-3 text-center">
                    <a href="{{ url_for('booked_students') }}" class="text-secondary">Cancel and go back</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
