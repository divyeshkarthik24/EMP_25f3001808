<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Management Portal</title>
    
    <!-- Bootstrap 5 CSS link as required by the project -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Custom styles to make it look a bit unique */
        body {
            background-color: #f4f6f9;
        }
        .navbar-custom {
            background-color: #004080; /* Standard university blue */
        }
        .main-box {
            background-color: white;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        .footer-text {
            text-align: center;
            margin-top: 50px;
            color: #6c757d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">EMP System</a>
        </div>
    </nav>

    <div class="container">
        
        <!-- Alerts for flash messages -->
        <div class="mt-3">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <!-- Dynamic content goes here -->
        {% block content %}{% endblock %}
        
    </div>

    <p class="footer-text">AppDev1 Project Submission &copy; 2026</p>

</body>
</html>
